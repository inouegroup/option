<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オプション単価表</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F1; --surface: #FFFFFF; --ink: #20281F; --ink-soft: #667061;
    --line: #DCE0D6; --line-strong: #B9C0AF; --accent: #4A6741; --accent-soft: #E7EDE2;
    --accent-ink: #2F4429; --stripe: #FAFBF8;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #171B15; --surface: #1E231C; --ink: #E8ECE4; --ink-soft: #9AA592;
    --line: #2E362A; --line-strong: #3D4738; --accent: #8FB380; --accent-soft: #263123;
    --accent-ink: #C4DBB9; --stripe: #1B201A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171B15; --surface: #1E231C; --ink: #E8ECE4; --ink-soft: #9AA592;
      --line: #2E362A; --line-strong: #3D4738; --accent: #8FB380; --accent-soft: #263123;
      --accent-ink: #C4DBB9; --stripe: #1B201A;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 32px 20px 60px; }

  header.page {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 20px;
  }
  header.page h1 { font-family: var(--serif); font-size: 25px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .save-html-btn {
    padding: 7px 12px; border: 1.5px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink-soft); font-size: 12px; cursor: pointer; font-family: var(--sans);
    white-space: nowrap;
  }
  .save-html-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  header.page .meta { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .search-box { position: relative; flex: 1 1 320px; }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 38px; border: 1.5px solid var(--line-strong);
    border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 14px; font-family: var(--sans);
  }
  .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--ink-soft); pointer-events: none; }
  select.filter {
    padding: 11px 12px; border: 1.5px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink); font-size: 14px; font-family: var(--sans); min-width: 170px;
  }
  select.filter:focus { outline: none; border-color: var(--accent); }
  button.reset {
    padding: 11px 16px; border: 1.5px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink-soft); font-size: 13px; cursor: pointer; font-family: var(--sans);
  }
  button.reset:hover { color: var(--ink); border-color: var(--ink-soft); }

  .result-count { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .result-count strong { color: var(--ink); font-weight: 700; }

  .table-scroll {
    overflow: auto; max-height: calc(100vh - 220px); touch-action: none;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    box-shadow: 0 1px 3px rgba(32,40,31,0.06);
  }
  table { border-collapse: collapse; width: 100%; min-width: 880px; table-layout: fixed; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; background: var(--ink); color: var(--bg); text-align: left;
    padding: 12px 14px; font-weight: 600; font-size: 12.5px; letter-spacing: 0.03em;
    white-space: nowrap; cursor: pointer; user-select: none;
    border-right: 1px solid rgba(255,255,255,0.10);
  }
  thead th:last-child { border-right: none; }
  thead th .arrow { display: inline-block; width: 12px; margin-left: 3px; opacity: 0.4; font-size: 11px; }
  thead th.active .arrow { opacity: 1; color: #D7C88A; }
  thead th.num { text-align: right; }

  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); word-break: break-word; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr:hover { background: var(--accent-soft); }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--mono); font-size: 13px; color: var(--ink); }
  tbody td.num.muted { color: var(--ink-soft); }
  td.name-cell .primary { font-weight: 600; line-height: 1.45; }
  td.name-cell .sub { color: var(--ink-soft); font-size: 12px; margin-top: 3px; }
  td.nowrap { white-space: nowrap; }
  .cat-cell { text-align: center; }
  .cat-badge {
    display: inline-block; min-width: 76px; text-align: center; padding: 3px 10px; border-radius: 4px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap;
  }

  .empty-row td { text-align: center; padding: 48px 12px; color: var(--ink-soft); }

  .card-list { display: none; }
  .price-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .price-card:active { background: var(--accent-soft); }
  .price-card .pc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .price-card .pc-name { font-weight: 600; font-size: 14.5px; line-height: 1.45; }
  .price-card .pc-spec { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; }
  .price-card .pc-img-btn { margin: 6px 0 0; }
  .price-card .pc-img-wrap { margin-top: 8px; }
  .price-card .pc-thumb { display: block; width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .price-card .pc-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft);
  }
  .price-card .pc-amounts { display: flex; gap: 18px; }
  .price-card .pc-amounts .amt-label { font-size: 11px; color: var(--ink-soft); }
  .price-card .pc-amounts .amt-val { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  .price-card .pc-amounts .amt-val.muted { color: var(--ink-soft); font-weight: 400; }

  @media (max-width: 640px) {
    .table-scroll { display: none; }
    .card-list { display: block; }
    .toolbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg); padding-top: 10px; padding-bottom: 10px; margin: -10px 0 6px;
    }
  }

  .card-list-empty { text-align: center; padding: 48px 12px; color: var(--ink-soft); font-size: 13.5px; }

  tbody tr { cursor: pointer; }


  .calc-btn {
    padding: 7px 12px; border: 1.5px solid var(--accent); border-radius: 6px;
    background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--sans); white-space: nowrap;
  }
  .calc-btn:hover { background: var(--surface); }
  #calcOverlay { z-index: 110; }
  .calc-title { font-size: 17px; font-weight: 700; margin: 0 0 14px; padding-right: 28px; }
  .calc-side { font-size: 11px; letter-spacing: .1em; color: var(--ink-soft); font-weight: 700; margin: 12px 0 6px; }
  .calc-seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .calc-seg button {
    flex: 1 1 0; line-height: 1.35; font: 700 13px var(--sans); padding: 9px 8px; border: 1.5px solid var(--line-strong);
    background: var(--stripe); color: var(--ink); border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .calc-seg button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc-label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-soft); margin-top: 14px; }
  .calc-label input {
    font: 600 20px var(--mono); width: 100%; padding: 9px 10px; border: 1.5px solid var(--line-strong);
    border-radius: 8px; background: var(--stripe); color: var(--ink);
  }
  .calc-label input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .calc-result { border-top: 2px dashed var(--line); margin-top: 16px; padding-top: 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .calc-result b { font: 600 36px var(--mono); color: var(--accent-ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .calc-result b.neg { color: #b3261e; }
  .calc-result small { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,24,18,0.45);
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    position: relative; background: var(--surface); color: var(--ink);
    width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 24px 22px 28px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
  }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
    .modal-card { border-radius: 12px; max-height: 76vh; }
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%;
    border: none; background: var(--stripe); color: var(--ink-soft); font-size: 14px; cursor: pointer;
  }
  .modal-close:hover { background: var(--accent-soft); color: var(--ink); }
  .modal-cat { margin-bottom: 10px; }
  .modal-title { font-size: 17px; font-weight: 700; line-height: 1.5; margin: 0 0 4px; padding-right: 24px; }
  .modal-spec { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .img-toggle-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; margin-bottom: 12px;
    border: 1.5px solid var(--line-strong); border-radius: 20px; background: var(--surface);
    color: var(--accent-ink); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--sans);
  }
  .img-toggle-btn:hover { background: var(--accent-soft); }
  .product-link-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; margin-bottom: 12px;
    border: 1.5px solid var(--line-strong); border-radius: 20px; background: var(--surface);
    color: var(--accent-ink); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--sans);
    text-decoration: none;
  }
  .product-link-btn:hover { background: var(--accent-soft); }
  .modal-image { display: block; width: 100%; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--line); background: #fff; }
  .modal-image-wrap { margin-bottom: 12px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .modal-field { border-top: 1px solid var(--line); padding-top: 10px; }
  .modal-field .flabel { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 3px; }
  .modal-field .fval { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .modal-field .fval.muted { color: var(--ink-soft); font-weight: 400; }
  .modal-note {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    background: var(--accent-soft); border: 1px solid var(--line);
  }
  .modal-note .flabel { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .modal-note-body { font-size: 12.5px; line-height: 1.7; color: var(--ink); }

  footer.note { margin-top: 16px; font-size: 12px; color: var(--ink-soft); }

  th.check-col, td.check-col { width: 36px; text-align: center; padding-left: 10px; padding-right: 10px; }
  input.row-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .pc-top .row-check { margin-right: 8px; }
  .pc-top-left { display: flex; align-items: center; gap: 8px; }

  .quote-bar {
    position: sticky; bottom: 16px; z-index: 30; margin-top: 16px;
    background: var(--ink); color: var(--bg); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; box-shadow: 0 6px 20px rgba(32,40,31,0.25);
  }
  .quote-bar.hidden { display: none; }
  .quote-bar .qb-info { font-size: 12.5px; opacity: 0.75; }
  .quote-bar .qb-total { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .quote-bar .qb-actions { display: flex; gap: 8px; }
  .quote-bar button {
    padding: 8px 14px; border: 1.5px solid rgba(244,245,241,0.35); border-radius: 6px;
    background: transparent; color: var(--bg); font-size: 12.5px; cursor: pointer; font-family: var(--sans);
  }
  .quote-bar button:hover { background: rgba(244,245,241,0.12); }

  .quote-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .quote-list-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .quote-list-item .qli-main { flex: 1; min-width: 0; }
  .quote-list-item .qli-name { font-size: 13.5px; font-weight: 600; line-height: 1.4; }
  .quote-list-item .qli-cat { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .quote-list-item .qli-amt {
    font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .quote-list-item .qli-remove {
    width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--stripe);
    color: var(--ink-soft); font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .quote-list-item .qli-remove:hover { background: var(--accent-soft); color: var(--ink); }
  .quote-list-empty { text-align: center; padding: 24px 12px; color: var(--ink-soft); font-size: 13.5px; }
  .quote-list-total {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--ink); font-size: 14px;
  }
  .quote-list-total strong { font-size: 19px; font-variant-numeric: tabular-nums; }

  .cost-toggle-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; margin: 4px 0 0;
    border: 1.5px dashed var(--line-strong); border-radius: 20px; background: transparent;
    color: var(--ink-soft); font-size: 11.5px; cursor: pointer; font-family: var(--sans);
  }
  .cost-toggle-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .cost-detail {
    display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    grid-template-columns: 1fr 1fr; gap: 14px 16px;
  }
  .cost-detail.open { display: grid; }
</style>
</head>

<script>
let DATA = [];
const NUM_COLS = ['追加金額','差額','仕入れ額','送料','定価'];
// data.csv を読み込む（Excelで「CSV UTF-8」保存したものをそのまま使える）
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* skip */ }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function loadData() {
  const res = await fetch('data.csv?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('data.csv を読み込めませんでした (' + res.status + ')');
  const rows = parseCSV(await res.text());
  const head = rows.shift().map(s => s.trim());
  DATA = rows.filter(r => r.some(v => v !== '')).map(r => {
    const o = {};
    head.forEach((h, i) => {
      let v = (r[i] === undefined ? '' : r[i]);
      if (NUM_COLS.includes(h)) {
        const t = v.replace(/[,\s]/g, '');
        if (t !== '' && !Number.isNaN(Number(t))) v = Number(t);
      }
      if (h === '画像') { v = v ? 'img/' + v : ''; }
      o[h] = v;
    });
    return o;
  });
  DATA.forEach((r, i) => { r.__id = i; });
}

const columns = [
  { key: 'カテゴリ合成', label: 'カテゴリ', sortKey: 'カテゴリ', type: 'cat' },
  { key: '商品合成', label: '商品', sortKey: '商品', type: 'name' },
  { key: '単位', label: '単位', type: 'text' },
  { key: '追加金額', label: '追加金額', type: 'num' },
  { key: '差額', label: '差額', type: 'num' },
  { key: '仕入先', label: '仕入先', type: 'text' },
];

// カテゴリごとに落ち着いた色を固定で割り当てる
const CATEGORY_PALETTE = {
  '床材':          { bg: '#EFE6D8', fg: '#7A5A2E' },
  'TOSO':          { bg: '#DCE7EF', fg: '#2E5A7A' },
  '森田アルミ':     { bg: '#E3E7DC', fg: '#4B5E38' },
  '川口技研':      { bg: '#E9DEE7', fg: '#6B3E63' },
  'スガツネ':      { bg: '#F0DFDC', fg: '#8A4436' },
  '電気':          { bg: '#FBEFC7', fg: '#8A6D12' },
  'ドアホン':      { bg: '#D9E7E3', fg: '#2E6E5C' },
  'ガス給湯器・幹太くん': { bg: '#E4E2F2', fg: '#4C468C' },
  'サッシ':        { bg: '#DCEAE7', fg: '#2E6E63' },
  'オンリーワン':   { bg: '#F2E6DC', fg: '#8A5A2E' },
  'カワジュン':     { bg: '#E3E9F2', fg: '#37507A' },
  '断熱':          { bg: '#F3E3E0', fg: '#8A3F35' },
};
const FALLBACK_PALETTE = ['#E7EDE2', '#DCE7EF', '#F0DFDC', '#E9DEE7'];
function catColor(cat) {
  if (CATEGORY_PALETTE[cat]) return CATEGORY_PALETTE[cat];
  let h = 0;
  for (let i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) >>> 0;
  const bg = FALLBACK_PALETTE[h % FALLBACK_PALETTE.length];
  return { bg, fg: 'var(--ink)' };
}

let sortState = { key: '', dir: 0 };
let currentRows = [];
const selected = new Set();
const COST_PASSWORD = '111423322';
let costUnlocked = false;

function itemCost(r) {
  const a = Number(r['追加金額']);
  const d = Number(r['差額']);
  return (Number.isNaN(a) ? 0 : a) + (Number.isNaN(d) ? 0 : d);
}

function updateQuoteBar() {
  const bar = document.getElementById('quoteBar');
  const count = selected.size;
  if (count === 0) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  const total = DATA.filter(r => selected.has(r.__id)).reduce((sum, r) => sum + itemCost(r), 0);
  document.getElementById('qbCount').textContent = count.toLocaleString('ja-JP');
  document.getElementById('qbTotal').textContent = '¥' + total.toLocaleString('ja-JP');
}

function toggleSelected(id, checked) {
  if (checked) selected.add(id); else selected.delete(id);
  updateQuoteBar();
}

function fmtVal(v) {
  if (v === '' || v === null || v === undefined) return '—';
  const n = Number(v);
  if (Number.isNaN(n)) return String(v); // '-'や'生産終了'等の文字はそのまま表示
  return n.toLocaleString('ja-JP');
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildHeader() {
  const row = document.getElementById('headerRow');
  row.innerHTML = '';
  const checkTh = document.createElement('th');
  checkTh.className = 'check-col';
  row.appendChild(checkTh);
  columns.forEach(col => {
    const th = document.createElement('th');
    if (col.type === 'num') th.classList.add('num');
    if (col.type === 'cat') th.style.textAlign = 'center';
    th.dataset.key = col.sortKey || col.key;
    th.innerHTML = col.label + '<span class="arrow">↕</span>';
    th.addEventListener('click', () => {
      const k = col.sortKey || col.key;
      if (sortState.key === k) {
        sortState.dir = sortState.dir === 1 ? -1 : (sortState.dir === -1 ? 0 : 1);
      } else {
        sortState = { key: k, dir: 1 };
      }
      render();
    });
    row.appendChild(th);
  });
}

function populateFilters() {
  const catSel = document.getElementById('categoryFilter');
  const vendorSel = document.getElementById('vendorFilter');
  const cats = [...new Set(DATA.map(r => r['カテゴリ']).filter(Boolean))];
  const vendors = [...new Set(DATA.map(r => r['仕入先']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const existingCats = new Set([...catSel.options].map(o => o.value));
  const existingVendors = new Set([...vendorSel.options].map(o => o.value));
  cats.forEach(c => {
    if (existingCats.has(c)) return;
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });
  vendors.forEach(v => {
    if (existingVendors.has(v)) return;
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    vendorSel.appendChild(o);
  });
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const vendor = document.getElementById('vendorFilter').value;
  return DATA.filter(r => {
    if (cat && r['カテゴリ'] !== cat) return false;
    if (vendor && r['仕入先'] !== vendor) return false;
    if (!q) return true;
    const hay = [r['商品'], r['仕様'], r['仕入先'], r['カテゴリ'], r['サブカテゴリ']].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function getSorted(rows) {
  if (!sortState.dir) return rows;
  const k = sortState.key;
  const numericCols = ['追加金額', '差額'];
  const isNum = numericCols.includes(k);
  const sorted = [...rows].sort((a, b) => {
    let av = a[k], bv = b[k];
    if (isNum) {
      const an = Number(av), bn = Number(bv);
      const aok = av !== '' && !Number.isNaN(an);
      const bok = bv !== '' && !Number.isNaN(bn);
      if (!aok && !bok) return 0;
      if (!aok) return -1;
      if (!bok) return 1;
      return an - bn;
    }
    av = String(av || ''); bv = String(bv || '');
    return av.localeCompare(bv, 'ja');
  });
  if (sortState.dir === -1) sorted.reverse();
  return sorted;
}
function render() {
  document.getElementById('totalCount').textContent = DATA.length.toLocaleString('ja-JP');
  const filtered = getFiltered();
  const sorted = getSorted(filtered);
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  document.querySelectorAll('#headerRow th').forEach(th => {
    th.classList.remove('active');
    const arrow = th.querySelector('.arrow');
    if (!arrow) return;
    if (th.dataset.key === sortState.key && sortState.dir !== 0) {
      th.classList.add('active');
      arrow.textContent = sortState.dir === 1 ? '▲' : '▼';
    } else {
      arrow.textContent = '↕';
    }
  });

  document.getElementById('shownCount').textContent = filtered.length.toLocaleString('ja-JP');

  if (sorted.length === 0) {
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    tr.innerHTML = `<td colspan="${columns.length + 1}">条件に一致する品目が見つかりません</td>`;
    tbody.appendChild(tr);
    return;
  }

  currentRows = sorted;
  const frag = document.createDocumentFragment();
  sorted.forEach((r, i) => {
    const catLabel = r['サブカテゴリ'] ? `${r['カテゴリ']}（${r['サブカテゴリ']}）` : r['カテゴリ'];
    const col = catColor(r['カテゴリ']);
    const addAmt = fmtVal(r['追加金額']);
    const diffAmt = fmtVal(r['差額']);
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    tr.innerHTML = `
      <td class="check-col"><input type="checkbox" class="row-check" ${selected.has(r.__id) ? 'checked' : ''}></td>
      <td class="cat-cell"><span class="cat-badge" style="background:${col.bg};color:${col.fg}">${escapeHtml(catLabel)}</span></td>
      <td class="name-cell">
        <div class="primary">${escapeHtml(r['商品'])}</div>
        ${r['仕様'] ? `<div class="sub">${escapeHtml(r['仕様'])}</div>` : ''}
      </td>
      <td class="nowrap">${escapeHtml(r['単位']) || '—'}</td>
      <td class="num${addAmt === '—' ? ' muted' : ''}">${addAmt}</td>
      <td class="num${diffAmt === '—' ? ' muted' : ''}">${diffAmt}</td>
      <td class="nowrap">${escapeHtml(r['仕入先']) || '—'}</td>
    `;
    tr.querySelector('.row-check').addEventListener('click', (e) => e.stopPropagation());
    tr.querySelector('.row-check').addEventListener('change', (e) => toggleSelected(r.__id, e.target.checked));
    tr.addEventListener('click', () => openModal(r));
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);

  renderCardList(sorted);
  updateQuoteBar();
}

function renderCardList(sorted) {

    const catLabel = r['サブカテゴリ'] ? `${r['カテゴリ']}（${r['サブカテゴリ']}）` : r['カテゴリ'];

      ${r['仕様'] ? `<div class="pc-spec">${escapeHtml(r['仕様'])}</div>` : ''}
      <div class="pc-row">

function openModal(r) {
  const catLabel = r['サブカテゴリ'] ? `${r['カテゴリ']}（${r['サブカテゴリ']}）` : r['カテゴリ'];
  const col = catColor(r['カテゴリ']);
  const addAmt = fmtVal(r['追加金額']);
  const diffAmt = fmtVal(r['差額']);
  const unit = escapeHtml(r['単位']) || '—';
  const vendor = escapeHtml(r['仕入先']) || '—';
  const costAmt = fmtVal(r['仕入れ額']);
  const shipAmt = fmtVal(r['送料']);
  const listAmt = fmtVal(r['定価']);
  const hasCostDetail = r['仕入れ額'] !== '' || r['送料'] !== '' || r['定価'] !== '';
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div class="modal-cat"><span class="cat-badge" style="background:${col.bg};color:${col.fg}">${escapeHtml(catLabel)}</span></div>
    <h2 class="modal-title">${escapeHtml(r['商品'])}</h2>
    ${r['仕様'] ? `<div class="modal-spec">${escapeHtml(r['仕様'])}</div>` : ''}
    ${r['URL'] ? (() => {
      const isPdfList = /wp-content\/uploads/.test(r['URL']) || /\.pdf(\?|$)/i.test(r['URL']);
      const label = isPdfList ? '📄 価格改定資料（PDF一覧）を見る' : '🔗 商品ページを見る';
      return `<a class="product-link-btn" href="${escapeHtml(r['URL'])}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    })() : ''}
    ${r['画像'] ? `
      <button class="img-toggle-btn" id="modalImgBtn">🖼 画像を見る</button>
      <div class="modal-image-wrap" id="modalImgWrap" style="display:none;">
        <img class="modal-image" src="${r['画像']}" alt="">
      </div>
    ` : ''}
    <div class="modal-grid">
      <div class="modal-field"><div class="flabel">単位</div><div class="fval">${unit}</div></div>
      <div class="modal-field"><div class="flabel">仕入先</div><div class="fval">${vendor}</div></div>
      <div class="modal-field"><div class="flabel">追加金額</div><div class="fval${addAmt === '—' ? ' muted' : ''}">${addAmt}</div></div>
      <div class="modal-field"><div class="flabel">差額</div><div class="fval${diffAmt === '—' ? ' muted' : ''}">${diffAmt}</div></div>
    </div>
    ${r['備考'] ? `
      <div class="modal-note">
        <div class="flabel">備考</div>
        <div class="modal-note-body">${r['備考'].split('\n').map(line => line === 'パネル工法のみ' ? '<span style="font-size:calc(1em + 2pt);font-weight:700">' + escapeHtml(line) + '</span>' : escapeHtml(line)).join('<br>')}</div>

    ${hasCostDetail ? `
      <button class="cost-toggle-btn" id="modalCostBtn">🔒 社内原価情報を見る</button>
      <div class="modal-grid cost-detail" id="modalCostDetail">
        <div class="modal-field"><div class="flabel">仕入れ額</div><div class="fval${costAmt === '—' ? ' muted' : ''}">${costAmt}</div></div>
        <div class="modal-field"><div class="flabel">送料</div><div class="fval${shipAmt === '—' ? ' muted' : ''}">${shipAmt}</div></div>
        <div class="modal-field"><div class="flabel">定価</div><div class="fval${listAmt === '—' ? ' muted' : ''}">${listAmt}</div></div>
      </div>

  `;
  if (r['画像']) {
    const btn = document.getElementById('modalImgBtn');
    const wrap = document.getElementById('modalImgWrap');
    btn.addEventListener('click', () => {
      const showing = wrap.style.display !== 'none';
      wrap.style.display = showing ? 'none' : 'block';

      const showing = wrap.classList.contains('open');
      if (!showing && !costUnlocked) {
        const pw = prompt('社内原価情報を表示するにはパスワードを入力してください');
        if (pw === null) return;
        if (pw !== COST_PASSWORD) { alert('パスワードが違います'); return; }
        costUnlocked = true;
      }
      wrap.classList.toggle('open', !showing);
      btn.textContent = showing ? '🔒 社内原価情報を見る' : '🔒 社内原価情報を隠す';

function openQuoteList() {
  const items = DATA.filter(r => selected.has(r.__id));
  if (items.length === 0) { closeModal(); return; }
  const total = items.reduce((sum, r) => sum + itemCost(r), 0);
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h2 class="modal-title">選択中の項目（${items.length}件）</h2>
    <div class="quote-list">
      ${items.map(r => `
        <div class="quote-list-item">
          <div class="qli-main">
            <div class="qli-name">${escapeHtml(r['商品'])}</div>
            <div class="qli-cat">${escapeHtml(r['カテゴリ'])}${r['サブカテゴリ'] ? '（' + escapeHtml(r['サブカテゴリ']) + '）' : ''}</div>
          </div>
          <div class="qli-amt">¥${itemCost(r).toLocaleString('ja-JP')}</div>
          <button type="button" class="qli-remove" data-id="${r.__id}" aria-label="削除">✕</button>
        </div>
      `).join('')}

    <div class="quote-list-total"><span>合計</span><strong>¥${total.toLocaleString('ja-JP')}</strong></div>

    btn.addEventListener('click', () => {

}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.getElementById('modalOverlay').addEventListener('pointerdown', e => { window.__mdDown = (e.target.id === 'modalOverlay'); });
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => {

});
document.addEventListener('keydown', (e) => {

});

// スマホでの斜めドラッグを防ぎ、縦・横どちらか一方の動きに限定する。
// touch-action:none でブラウザ標準のスクロールを止め、すべてJSで制御する。
// あわせて、動きがほぼ無い場合はタップとして扱い、確実にカードを開く。
(function lockScrollAxis() {
  const el = document.getElementById('tableScroll');
  let startX = 0, startY = 0, lastX = 0, lastY = 0, axis = null;

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = lastX = t.clientX;
    startY = lastY = t.clientY;
    axis = null;
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - lastX;
    const dy = t.clientY - lastY;
    if (!axis) {
      const adx = Math.abs(t.clientX - startX);
      const ady = Math.abs(t.clientY - startY);
      if (adx > 6 || ady > 6) axis = adx > ady ? 'x' : 'y';
    }
    if (axis === 'x') {
      el.scrollLeft -= dx;
    } else if (axis === 'y') {
      el.scrollTop -= dy;
    }
    e.preventDefault();
    lastX = t.clientX;
    lastY = t.clientY;
  }, { passive: false });

  el.addEventListener('touchend', (e) => {
    if (axis === null) {
      // 動きがなかった＝タップ：その位置の行を探してカードを開く
      const t = e.changedTouches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY);
      const row = target && target.closest('tr[data-idx]');
      if (row) {
        const idx = Number(row.dataset.idx);
        if (currentRows[idx]) openModal(currentRows[idx]);
      }
      e.preventDefault();
    }
    axis = null;
  }, { passive: false });
})();

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);
document.getElementById('vendorFilter').addEventListener('change', render);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('vendorFilter').value = '';
  render();
});

document.getElementById('qbClear').addEventListener('click', () => {

});

  p.textContent = 'データを読み込めませんでした: ' + err.message;
  w.appendChild(p);
});

// ---- 売価計算（積算ポケットより）
(function(){
  const $c = id => document.getElementById(id);
  function kake() {
    const m = $c('kMode').querySelector('[aria-pressed="true"]'), d = +m.dataset.d;
    const L = parseFloat($c('kList').value.replace(/[,\s]/g, '')), r = parseFloat($c('kRate').value) / 100;
    const net = Math.round(L * r) - d;
    const raw = Math.round(net / 0.66 * 100) / 100;
    const unit = raw < 10000 ? 10 : 100;   // 1万円未満は下1桁（10円単位）、1万円以上は100円単位で切り上げ
    const sell = Math.ceil(raw / unit) * unit;
    $c('kSell').textContent = isFinite(sell) ? sell.toLocaleString('ja-JP') : '-';
    $c('kSell').className = sell < 0 ? 'neg' : '';
    $c('kLabel').textContent = '円（' + m.dataset.l + '）';
  }
  function pick(id, after) {
    $c(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      $c(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      after(b); kake();
    });
  }
  pick('kMaker', b => { $c('kRate').value = b.dataset.r; });
  pick('kMode', () => {});
  // 全角数字は半角に直す（IMEの状態は触らない）
  const norm = e => {
    if (e.isComposing) return;
    const el = $c('kList');
    const v = el.value.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/[，、]/g, ',');
    if (v !== el.value) el.value = v;
    kake();
  };
  $c('kList').addEventListener('input', norm);
  $c('kList').addEventListener('compositionend', norm);
  const ov = $c('calcOverlay');
  const close = () => ov.classList.remove('open');
  $c('calcOpenBtn').addEventListener('click', () => { ov.classList.add('open'); kake();  });
  $c('calcClose').addEventListener('click', close);
  // 文字を範囲選択中にパネル外へマウスが出ても閉じない（押し始めも外側のときだけ閉じる）
  let downOnOv = false;
  ov.addEventListener('pointerdown', e => { downOnOv = (e.target === ov); });
  ov.addEventListener('click', e => { if (e.target === ov && downOnOv) close(); downOnOv = false; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  kake();
})();
</script>
