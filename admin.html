<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オプション単価表 データ更新</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
  /* 単価表本体と同じトークン。1カラムの手順ページ */
  :root {
    --bg: #F4F5F1; --surface: #FFFFFF; --ink: #20281F; --ink-soft: #667061;
    --line: #DCE0D6; --line-strong: #B9C0AF; --accent: #4A6741; --accent-soft: #E7EDE2;
    --accent-ink: #2F4429; --stripe: #FAFBF8; --bad: #b3261e; --bad-soft: #FBEDEB;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    --mono: 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171B15; --surface: #1E231C; --ink: #E8ECE4; --ink-soft: #9AA592;
      --line: #2E362A; --line-strong: #3D4738; --accent: #8FB380; --accent-soft: #263123;
      --accent-ink: #C4DBB9; --stripe: #1B201A; --bad: #F2A99F; --bad-soft: #3A2420;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
  header.page { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 22px; }
  h1 { font-family: var(--serif); font-size: 23px; font-weight: 600; margin: 0; }
  header a { color: var(--ink-soft); font-size: 13px; }
  .step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .step h2 { font-size: 14px; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; }
  .step h2 .no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: var(--bg); font-size: 12px; }
  .step.disabled { opacity: .5; pointer-events: none; }
  p.hint { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.7; }
  button.btn { font: 700 13.5px var(--sans); padding: 10px 18px; border-radius: 6px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff; }
  button.btn.sub { background: var(--surface); color: var(--ink-soft); border-color: var(--line-strong); }
  button.btn:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .who { font-size: 13px; }
  input[type=file] { font: 13px var(--sans); max-width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { border-top: 1px solid var(--line); padding-top: 8px; }
  .stat .k { font-size: 11.5px; color: var(--ink-soft); }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .changes { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
  .changes div { padding: 7px 10px; border-bottom: 1px solid var(--line); line-height: 1.5; }
  .changes div:nth-child(even) { background: var(--stripe); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
  .tag.add { background: var(--accent-soft); color: var(--accent-ink); }
  .tag.del { background: var(--bad-soft); color: var(--bad); }
  .tag.chg { background: var(--stripe); color: var(--ink); border: 1px solid var(--line-strong); }
  .msg { margin-top: 12px; padding: 11px 13px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .msg.ok { background: var(--accent-soft); color: var(--accent-ink); }
  .msg.err { background: var(--bad-soft); color: var(--bad); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>オプション単価表 データ更新</h1>
    <a href="index.html">← 単価表に戻る</a>
  </header>

  <section class="step" id="step1">
    <h2><span class="no">1</span>Googleでログイン</h2>
    <div class="row">
      <button class="btn" id="loginBtn" type="button">Googleでログイン</button>
      <button class="btn sub" id="logoutBtn" type="button" hidden>ログアウト</button>
      <span class="who" id="who"></span>
    </div>
    <p class="hint">更新できるのは、Firestoreのルールに登録したメールアドレスのアカウントだけです。</p>
  </section>

  <section class="step disabled" id="step2">
    <h2><span class="no">2</span>Excelを選ぶ</h2>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls">
    <p class="hint">「価格表」シートを読み込みます（1行目が見出し：カテゴリ／サブカテゴリ／商品／仕様／単位／追加金額／差額／仕入れ額／送料／定価／仕入先／URL／備考）。</p>
    <div id="parseMsg"></div>
  </section>

  <section class="step disabled" id="step3">
    <h2><span class="no">3</span>変更内容を確認して更新</h2>
    <div class="stats">
      <div class="stat"><div class="k">Excelの行数</div><div class="v" id="sNew">-</div></div>
      <div class="stat"><div class="k">いまの行数</div><div class="v" id="sOld">-</div></div>
      <div class="stat"><div class="k">追加</div><div class="v" id="sAdd">-</div></div>
      <div class="stat"><div class="k">削除</div><div class="v" id="sDel">-</div></div>
      <div class="stat"><div class="k">変更</div><div class="v" id="sChg">-</div></div>
    </div>
    <div class="changes" id="changes"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="uploadBtn" type="button" disabled>この内容で更新する</button>
    </div>
    <div id="uploadMsg"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA1m5FJR7TpQ6j74AKzw6JvMgGG3jAtB8k",
  authDomain: "option-807c5.firebaseapp.com",
  projectId: "option-807c5",
  storageBucket: "option-807c5.firebasestorage.app",
  messagingSenderId: "466998377835",
  appId: "1:466998377835:web:4c798d0664e078b603202e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const fdb = firebase.firestore();

const KEYS = ['カテゴリ','サブカテゴリ','商品','仕様','単位','追加金額','差額','仕入れ額','送料','定価','仕入先','URL','備考'];
const CHUNK_BYTES = 700 * 1024;   // Firestoreの1件1MB上限に余裕をもたせる
const $ = id => document.getElementById(id);
let newRows = null, oldRows = [], oldMeta = null, fileName = '';

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function msg(el, text, kind) { $(el).innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ''; }

// ---------- ログイン
$('loginBtn').addEventListener('click', async () => {
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) { msg('parseMsg', 'ログインできませんでした：' + esc(e.message), 'err'); }
});
$('logoutBtn').addEventListener('click', () => auth.signOut());
auth.onAuthStateChanged(async user => {
  $('loginBtn').hidden = !!user;
  $('logoutBtn').hidden = !user;
  $('who').textContent = user ? user.email + ' でログイン中' : '';
  $('step2').classList.toggle('disabled', !user);
  if (user) await loadCurrent();
});

async function loadCurrent() {
  try {
    const m = await fdb.doc('meta/info').get();
    if (!m.exists) { oldRows = []; oldMeta = null; return; }
    oldMeta = m.data();
    const snaps = await Promise.all(oldMeta.chunks.map(id => fdb.doc('prices/' + id).get()));
    oldRows = [];
    snaps.forEach(s => { if (s.exists) oldRows = oldRows.concat(JSON.parse(s.data().rows)); });
  } catch (e) { console.error(e); oldRows = []; }
}

// ---------- Excel 読み込み
function normVal(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return Math.round(v * 100) / 100;   // 3136.0000000005 のような誤差を丸める
  if (v instanceof Date) return v.toLocaleDateString('ja-JP');
  return String(v).replace(/\r\n?/g, '\n');
}

$('fileInput').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  fileName = f.name;
  msg('parseMsg', '', '');
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const sheetName = wb.SheetNames.includes('価格表') ? '価格表' : wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: null, raw: true });
    const hdr = (aoa[0] || []).map(h => h === null ? '' : String(h).trim());
    const missing = ['カテゴリ','商品'].filter(k => !hdr.includes(k));
    if (missing.length) throw new Error(`「${sheetName}」シートの1行目に ${missing.join('・')} の見出しがありません。`);
    const rows = [];
    for (let i = 1; i < aoa.length; i++) {
      const line = aoa[i] || [];
      const r = {};
      KEYS.forEach(k => { const c = hdr.indexOf(k); r[k] = c >= 0 ? normVal(line[c]) : ''; });
      if (r['商品'] === '' && r['カテゴリ'] === '') continue;   // 空行は飛ばす
      if (r['URL'] === '') delete r['URL'];
      if (r['備考'] === '') delete r['備考'];
      rows.push(r);
    }
    if (!rows.length) throw new Error('データ行が見つかりませんでした。');
    newRows = rows;
    msg('parseMsg', `「${esc(sheetName)}」シートから ${rows.length.toLocaleString()} 行を読み込みました。`, 'ok');
    showDiff();
  } catch (err) {
    newRows = null;
    $('step3').classList.add('disabled');
    msg('parseMsg', 'Excelを読み込めませんでした：' + esc(err.message), 'err');
  }
});

// ---------- 差分表示（商品＋仕様＋カテゴリで同じ行とみなす）
function keyOf(r) { return [r['カテゴリ'], r['サブカテゴリ'], r['商品'], r['仕様']].join('\u0001'); }
function label(r) { return esc(r['商品']) + (r['仕様'] ? `<span style="color:var(--ink-soft)">（${esc(r['仕様'])}）</span>` : ''); }
function showDiff() {
  const oldMap = new Map(), newMap = new Map();
  oldRows.forEach(r => { const k = keyOf(r); if (!oldMap.has(k)) oldMap.set(k, r); });
  newRows.forEach(r => { const k = keyOf(r); if (!newMap.has(k)) newMap.set(k, r); });
  const adds = [], dels = [], chgs = [];
  newMap.forEach((r, k) => {
    const o = oldMap.get(k);
    if (!o) { adds.push(r); return; }
    const diffs = KEYS.filter(f => String(o[f] ?? '') !== String(r[f] ?? ''));
    if (diffs.length) chgs.push({ r, o, diffs });
  });
  oldMap.forEach((r, k) => { if (!newMap.has(k)) dels.push(r); });
  $('sNew').textContent = newRows.length.toLocaleString();
  $('sOld').textContent = oldRows.length ? oldRows.length.toLocaleString() : '0';
  $('sAdd').textContent = adds.length; $('sDel').textContent = dels.length; $('sChg').textContent = chgs.length;
  const items = [
    ...chgs.map(c => `<div><span class="tag chg">変更</span>${label(c.r)}<br>${c.diffs.map(f => `${esc(f)}：<span class="mono">${esc(c.o[f] ?? '') || '空欄'} → ${esc(c.r[f] ?? '') || '空欄'}</span>`).join('　')}</div>`),
    ...adds.map(r => `<div><span class="tag add">追加</span>${label(r)}</div>`),
    ...dels.map(r => `<div><span class="tag del">削除</span>${label(r)}</div>`),
  ];
  const LIMIT = 300;
  $('changes').innerHTML = !oldRows.length ? '<div>初回の登録です（いまのデータは空）。</div>'
    : items.length ? items.slice(0, LIMIT).join('') + (items.length > LIMIT ? `<div>…ほか ${items.length - LIMIT} 件</div>` : '')
    : '<div>いまのデータと同じ内容です。</div>';
  $('step3').classList.remove('disabled');
  $('uploadBtn').disabled = false;
  msg('uploadMsg', '', '');
}

// ---------- アップロード
function splitChunks(rows) {
  const enc = new TextEncoder(), chunks = [];
  let cur = [], size = 2;
  rows.forEach(r => {
    const b = enc.encode(JSON.stringify(r)).length + 1;
    if (cur.length && size + b > CHUNK_BYTES) { chunks.push(cur); cur = []; size = 2; }
    cur.push(r); size += b;
  });
  if (cur.length) chunks.push(cur);
  return chunks;
}

$('uploadBtn').addEventListener('click', async () => {
  if (!newRows) return;
  const btn = $('uploadBtn');
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    const version = Date.now().toString(36);
    const chunks = splitChunks(newRows);
    const ids = chunks.map((_, i) => `v${version}_${i}`);
    const batch = fdb.batch();
    chunks.forEach((c, i) => batch.set(fdb.doc('prices/' + ids[i]), { rows: JSON.stringify(c) }));
    batch.set(fdb.doc('meta/info'), {
      chunks: ids, version, count: newRows.length, fileName,
      updatedBy: auth.currentUser.email,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();
    // 古いデータを片付ける（失敗しても表示には影響しない）
    try {
      const all = await fdb.collection('prices').get();
      const del = fdb.batch(); let n = 0;
      all.forEach(d => { if (!ids.includes(d.id)) { del.delete(d.ref); n++; } });
      if (n) await del.commit();
    } catch (e) { console.warn(e); }
    oldRows = newRows.slice();
    msg('uploadMsg', `更新しました（${newRows.length.toLocaleString()} 行）。単価表を開き直すと反映されています。 <a href="index.html">単価表を開く</a>`, 'ok');
    btn.textContent = 'この内容で更新する';
  } catch (e) {
    console.error(e);
    const denied = e && (e.code === 'permission-denied' || /permission/i.test(e.message));
    msg('uploadMsg', denied
      ? `このアカウント（${esc(auth.currentUser && auth.currentUser.email)}）には書き込み権限がありません。Firestoreのルールに書いたメールアドレスと同じアカウントでログインしてください。`
      : '更新できませんでした：' + esc(e.message), 'err');
    btn.disabled = false; btn.textContent = 'この内容で更新する';
  }
});
</script>
</body>
</html>
